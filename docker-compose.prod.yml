version: '3.8'

services:
  web:
    build:
      context: .
      args:
        # Analytics is optional — empty default keeps it off for deploys that don't configure it
        NEXT_PUBLIC_UMAMI_SRC: ${NEXT_PUBLIC_UMAMI_SRC:-}
        NEXT_PUBLIC_UMAMI_WEBSITE_ID: ${NEXT_PUBLIC_UMAMI_WEBSITE_ID:-}
    ports:
      - "3001:3000"
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    restart: unless-stopped
    init: true        # reap zombie chrome procs (npm as PID 1 doesn't; 144 had leaked)
    mem_limit: 1g     # bound the scraper's headless-chrome so it can't OOM the 4GB box
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
